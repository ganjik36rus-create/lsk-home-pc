<!DOCTYPE html>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .background {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1581090463632-688373398365?auto=format&fit=crop&w=1950&q=80') no-repeat center center/cover;
            background-attachment: fixed;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7));
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 3.5em;
            color: #fff;
            text-shadow: 2px 2px 8px #000;
            margin-bottom: 20px;
            animation: fadeIn 1.5s ease-out;
        }

        .services {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .service-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 30px;
            border-radius: 10px;
            color: #fff;
            font-size: 1.2em;
            text-shadow: 1px 1px 4px #000;
            animation: bounceIn 1.2s ease;
        }

        .cta-button {
            margin-top: 40px;
            padding: 15px 30px;
            font-size: 1.2em;
            background: linear-gradient(45deg, #ff6f61, #f39c12);
            border: none;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.4);
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(30px);}
            to {opacity: 1; transform: translateY(0);}
        }

        @keyframes bounceIn {
            0% {transform: scale(0.8);}
            50% {transform: scale(1.05);}
            100% {transform: scale(1);}
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            .service-item {
                font-size: 1em;
                padding: 15px 25px;
